name: genui_gen
description: Annotations and runtime helpers to generate a2ui_flutter components from your own Flutter widgets. Derive the schema from the constructor so the catalog can never drift.
version: 0.15.0
homepage: https://diegolopezrm.github.io/genui_gen/
repository: https://github.com/diegolopezrm/genui_gen
issue_tracker: https://github.com/diegolopezrm/genui_gen/issues
topics:
  - genui
  - generative-ui
  - codegen
  - a2ui
  - ai

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  a2ui_core: ">=0.6.0 <0.8.0"
  a2ui_flutter: ">=0.2.0 <0.4.0"
  flutter:
    sdk: flutter
  json_schema_builder: ">=0.1.7 <0.2.0"
  logging: ">=1.2.0 <2.0.0"
  meta: ">=1.16.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0 <7.0.0"

name: genui_gen
description: Annotations and runtime helpers to generate genui CatalogItems from your own Flutter widgets. Derive the schema from the constructor so the catalog can never drift.
version: 0.3.0
repository: https://github.com/diegolopezrm/genui_gen
issue_tracker: https://github.com/diegolopezrm/genui_gen/issues
topics:
  - genui
  - generative-ui
  - codegen
  - a2ui
  - ai

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  genui: ">=0.10.0 <0.11.0"
  meta: ">=1.16.0 <2.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0 <7.0.0"
  json_schema_builder: ^0.1.3

# This example is a real package so that the file pub.dev shows on the Example
# tab is the file the generator actually runs over: `main.genui.dart` next to
# it is generated output, committed, and checked for staleness in CI.
name: genui_gen_example
description: The smallest complete genui_gen setup, shown on pub.dev's Example tab.
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  genui: ">=0.10.0 <0.11.0"
  genui_gen: ^0.3.0

dev_dependencies:
  build_runner: ^2.15.0
  genui_gen_builder: ^0.3.0

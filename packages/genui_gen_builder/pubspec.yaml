name: genui_gen_builder
description: build_runner generator for genui_gen. Turns @GenUiWidget-annotated Flutter widgets into genui CatalogItems with schema, builder and examples derived from the constructor.
version: 0.1.2
repository: https://github.com/diegolopezrm/genui_gen
issue_tracker: https://github.com/diegolopezrm/genui_gen/issues
topics:
  - genui
  - generative-ui
  - codegen
  - build-runner
  - source-gen

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  analyzer: ">=10.0.0 <15.0.0"
  build: ">=4.0.0 <5.0.0"
  source_gen: ">=4.1.0 <5.0.0"

dev_dependencies:
  build_runner: ">=2.15.0 <3.0.0"
  build_test: ">=3.0.0 <4.0.0"
  lints: ">=6.0.0 <7.0.0"
  test: ">=1.25.0 <2.0.0"

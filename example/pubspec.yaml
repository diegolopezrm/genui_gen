name: example
description: Example app for genui_gen, eight annotated widgets rendered through a2ui_flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  a2ui_core: ^0.7.0
  flutter:
    sdk: flutter
  a2ui_flutter: ^0.3.0
  genui_gen: ^0.15.0

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  genui_gen_builder: ^0.14.0

flutter:
  uses-material-design: true

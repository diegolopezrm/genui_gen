name: example
description: Example app for genui_gen — four annotated widgets rendered offline through genui's DebugCatalogView.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.35.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  genui: ^0.10.0
  genui_gen: ^0.1.0
  json_schema_builder: ^0.1.3

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  genui_gen_builder: ^0.1.0

flutter:
  uses-material-design: true
